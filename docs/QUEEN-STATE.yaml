    summary: "Quality scripts and GitHub CI added"
    evidence: "package.json: typecheck, lint:strict, test:unit, test:integration, check; .github/workflows/ci.yml"
  - id: SEC-002
    summary: "Webhook verification now fails closed on absent secrets"
    evidence: "src/lib/webhooks/verification.ts; 4 routes migrated; tests/unit/lib/webhook-verification.test.ts 20 passed"
    defects_fixed:
      - "email-events: `requireVerification && webhookSecret` skipped verification entirely when EMAIL_WEBHOOK_SECRET was unset, including in production. Endpoint suppresses leads and mutates campaign stats."
      - "postmark: `if (POSTMARK_WEBHOOK_TOKEN)` left the endpoint fully unauthenticated in every environment when the token was unset."
      - "webhooks.ts verifyWebhookSignature('ses', ...) returned true unconditionally; now throws. No current caller passes 'ses'."
      - "SNS SigningCertURL and SubscribeURL accepted any *.amazonaws.com host (e.g. an S3 bucket), enabling SSRF and signature bypass. Now requires sns.<region>.amazonaws.com over https."
      - "sendgrid: outside production a FAILED signature was logged and the request processed anyway."
      - "email-events: x-webhook-timestamp is now required; previously a timestamp-less signed payload could be replayed indefinitely."
    breaking_change: >-
      /api/webhooks/email-events now requires the x-webhook-timestamp header and
      returns 503 when EMAIL_WEBHOOK_SECRET is unset. Internal senders that
      omitted the header must be updated. Any provider whose secret is not
      configured will now receive 503 instead of being silently accepted.

