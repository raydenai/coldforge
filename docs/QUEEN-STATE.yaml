risks:
  - id: schema-truth
    severity: critical
    detail: >-
      11 tables the application queries 234 times have no DDL anywhere in the
      repository (workspace_members 75, profiles 57, mailboxes 33, email_jobs 21,
      workspaces 12, organization_members 6, lead_tags 5, inbox_messages 4,
      subscriptions 4, sync_states 4, credit_packages 3). A clean checkout
      provisioned from supabase/migrations/ cannot run the application.
  - id: migrations-do-not-apply
    severity: critical
    detail: >-
      `supabase start` fails at 007_warmup_pool.sql: warmup_emails is created by
      both 001 and 007, and warmup_schedules by both 007 and 010. The migration
      set has never been applied as a set.
  - id: tenancy-split
    severity: high
    detail: >-
      warmup/* routes authorize against organization_members while
      reputation/*, integrations/*, smtp-providers/*, email-queue and
      oauth/authorize authorize against workspace_members. Tenant isolation is
      inconsistent across the API surface.
  - id: webhooks-fail-open
    severity: resolved
    detail: >-
      Resolved by SEC-002. Verification is now unconditional and an absent secret
      returns 503 instead of skipping the check. Deployments must set a secret
      for every provider they actually receive webhooks from, or those endpoints
      will return 503.
  - id: encryption-salt-fallback
    severity: high
    detail: >-
      src/lib/encryption.ts:15 falls back to the literal
      'instantscale-default-salt'. Startup validation now requires ENCRYPTION_SALT
      in production, but the fallback itself remains in the code (FND-012).

